<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>
    <link rel="stylesheet" href="ludo.css">
</head>
<body>

<div class="board">

    <div class="home red-home">
        <div class="inner">
            <span></span><span></span>
            <span></span><span></span>
        </div>
    </div>

    <div class="home green-home">
        <div class="inner">
            <span></span><span></span>
            <span></span><span></span>
        </div>
    </div>

    <div class="home yellow-home">
        <div class="inner">
            <span></span><span></span>
            <span></span><span></span>
        </div>
    </div>

    <div class="home blue-home">
        <div class="inner">
            <span></span><span></span>
            <span></span><span></span>
        </div>
    </div>

    <div class="path path-top"></div>
    <div class="path path-bottom"></div>
    <div class="path path-left"></div>
    <div class="path path-right"></div>

    <div class="center">
        <div class="red-triangle"></div>
        <div class="green-triangle"></div>
        <div class="yellow-triangle"></div>
        <div class="blue-triangle"></div>
    </div>

</div>

</body>
</html>
