<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create New Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="signup-container">

        <!-- Logo -->
        <h1>facebook</h1>

        <!-- Signup Box -->
        <div class="signup-box">

            <h2>Create a new account</h2>

            <p class="subtitle">
                It's quick and easy.
            </p>

            <hr>

            <!-- Name -->
            <div class="name-fields">

                <input 
                    type="text" 
                    placeholder="First name"
                >

                <input 
                    type="text" 
                    placeholder="Surname"
                >

            </div>

            <!-- Email / Phone -->
            <input 
                type="text"
                class="full-input"
                placeholder="Mobile number or email address"
            >

            <!-- Password -->
            <input 
                type="password"
                class="full-input"
                placeholder="New password"
            >

            <!-- Date of Birth -->
            <label class="label">
                Date of birth
            </label>

            <div class="dob">

                <select>
                    <option>Day</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                    <option>9</option>
                    <option>10</option>
                    <option>11</option>
                    <option>12</option>
                    <option>13</option>
                    <option>14</option>
                    <option>15</option>
                    <option>16</option>
                    <option>17</option>
                    <option>18</option>
                    <option>19</option>
                    <option>20</option>
                    <option>21</option>
                    <option>22</option>
                    <option>23</option>
                    <option>24</option>
                    <option>25</option>
                    <option>26</option>
                    <option>27</option>
                    <option>28</option>
                    <option>29</option>
                    <option>30</option>
                    <option>31</option>
                </select>

                <select>
                    <option>Month</option>
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                    <option>April</option>
                    <option>May</option>
                    <option>June</option>
                    <option>July</option>
                    <option>August</option>
                    <option>September</option>
                    <option>October</option>
                    <option>November</option>
                    <option>December</option>
                </select>

                <select>
                    <option>Year</option>
                    <option>2000</option>
                    <option>2001</option>
                    <option>2002</option>
                    <option>2003</option>
                    <option>2004</option>
                    <option>2005</option>
                    <option>2006</option>
                    <option>2007</option>
                    <option>2008</option>
                    <option>2009</option>
                    <option>2010</option>
                </select>

            </div>


            <!-- Gender -->
            <label class="label">
                Gender
            </label>

            <div class="gender">

                <label>
                    Female
                    <input type="radio" name="gender">
                </label>

                <label>
                    Male
                    <input type="radio" name="gender">
                </label>

                <label>
                    Custom
                    <input type="radio" name="gender">
                </label>

            </div>


            <!-- Terms -->
            <p class="terms">
                People who use our service may have uploaded your
                contact information to Facebook.
            </p>

            <p class="terms">
                By clicking Sign Up, you agree to our Terms,
                Privacy Policy and Cookies Policy.
            </p>


            <!-- Create Account -->
            <button class="signup-btn">
                Sign Up
            </button>


            <!-- Already Account -->
            <a href="#" class="login-link">
                Already have an account?
            </a>

        </div>

    </div>

</body>
</html>
```
